# Assumes gomoku/ is the Git repository root.
services:
  - type: web
    name: gomoku-backend
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: GOMOKU_FRONTEND_URL
        value: https://lihongcheng.github.io/gomoku/
      - key: GOMOKU_ALLOWED_ORIGINS
        value: '["https://lihongcheng.github.io"]'
      - key: GOMOKU_ADMIN_TOKEN
        generateValue: true
      - key: GOMOKU_ALLOW_MISSING_ORIGIN
        value: "false"
